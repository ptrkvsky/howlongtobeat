# POC: publishes the 5 latest GameSpot news read by /actus, at 6:00, 11:30
# and 17:30 Paris time. Cron is in UTC: each slot is scheduled for UTC+1 and
# UTC+2, scripts/fetch-gamespot.ts only keeps the run matching Paris time.
name: GameSpot news

on:
  schedule:
    - cron: '0 4,5 * * *'
    - cron: '30 9,10 * * *'
    - cron: '30 15,16 * * *'
  workflow_dispatch:

concurrency:
  group: gamespot-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm tsx scripts/fetch-gamespot.ts ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
